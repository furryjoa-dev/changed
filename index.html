<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Changed Special</title>
<link rel="manifest" href="web/app.webmanifest">
<link rel="icon" href="web/icons/icon-192.png">
<link rel="apple-touch-icon" href="web/icons/icon-192.png">
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="screen" width="544" height="416"></canvas></div>
  <div id="touch" hidden>
    <div id="dpad"><i></i></div>
    <div id="btns">
      <button data-key="B" class="b">취소</button>
      <button data-key="C" class="c">확인</button>
      <button data-key="A" class="a">대시</button>
      <button data-key="CTRL" class="s">스킵</button>
    </div>
  </div>
  <button id="fs" title="전체화면" aria-label="전체화면">⛶</button>
</div>
<div id="boot">
  <h1>Changed Special</h1>
  <div id="status">불러오는 중…</div>
  <div id="barwrap"><div id="bar"></div></div>
</div>
<div id="start" hidden>
  <h1>Changed Special</h1>
  <button id="startBtn">시작하기</button>
  <p>PC · 방향키 이동 / Z·Enter·Space 확인 / X·Esc 취소 / Shift 대시 / Ctrl 대화 빨리감기<br>모바일 · 화면의 패드와 버튼 사용 (가로 모드 권장)</p>
</div>
<pre id="fatal" hidden></pre>
<script src="web/dist/main.js"></script>
<script>
(function () {
  if ('serviceWorker' in navigator && !/[?&]nosw\b/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(function () {});
  var coarse = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  if (coarse) document.getElementById('touch').hidden = false;
  document.getElementById('fs').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
  });
})();
</script>
</body>
</html>
